name: Refresh feed

# Fetches every source in sources.yml, merges the results with the feed that is
# currently live, and publishes the dashboard to GitHub Pages.
on:
  schedule:
    # GitHub starts scheduled runs late or drops them when it is busy (on 26 Oct 2026 a 15-minute
    # schedule ran about every 45 minutes). So the workflow wakes every 5 minutes, away from the
    # busy top of the hour, and the "due" job below skips the work while the live feed is fresh:
    # feeds are still fetched about every 15 minutes, but a dropped run costs 5 minutes, not 15.
    - cron: "2-57/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One refresh at a time, so two runs never race to publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  due:
    # Scheduled runs refresh only when the live feed is at least 12 minutes old. Pushes and
    # manual runs always refresh. If the age can't be read, refresh anyway.
    name: Check if a refresh is due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read # configure-pages looks up the site's URL
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Compare the live feed's age with the refresh interval
        id: check
        env:
          EVENT: ${{ github.event_name }}
          LIVE_FEED: ${{ steps.pages.outputs.base_url }}/data/feed.json
          MIN_AGE_SECONDS: "720"
        run: |
          due=true
          if [ "${EVENT}" = "schedule" ]; then
            # ?due=<run id> gets past the Pages cache, like the build's ?run=.
            generated=$(curl -fsS --max-time 20 "${LIVE_FEED}?due=${GITHUB_RUN_ID}" | jq -r '.generated_at // empty' 2>/dev/null) || generated=""
            built=$(date -u -d "${generated}" +%s 2>/dev/null) || built=""
            if [ -n "${generated}" ] && [ -n "${built}" ]; then
              age=$(( $(date -u +%s) - built ))
              echo "The live feed was built ${age} s ago (${generated})."
              if [ "${age}" -lt "${MIN_AGE_SECONDS}" ]; then due=false; fi
            else
              echo "Couldn't read the live feed's age; refreshing anyway."
            fi
          fi
          echo "Refresh due: ${due}"
          echo "due=${due}" >> "${GITHUB_OUTPUT}"

  build:
    # Runs the fetcher (third-party feeds and packages) with read-only permissions.
    name: Fetch feeds
    needs: due
    if: needs.due.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages looks up the site's URL
      actions: read # find this workflow's previous run and its saved feed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false  # nothing here pushes; keep the token off disk
      # No dependency cache here: caches can be written by other workflows on main.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies (hash-pinned)
        run: pip install --only-binary ':all:' --require-hashes -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Restore the saved copy of the feed
        # Only used if the live feed.json answers 404 (e.g. a Pages hiccup), so history survives.
        # It comes from this workflow's own last successful scheduled or push run on main: those
        # always run main's own code (a manual run can be started from any ref). Runs that skipped
        # the refresh (feed still fresh) saved nothing, so the newest run that has a copy is used.
        # Best effort: if the lookup fails, the run carries on without it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh.yml --branch main \
            --status success --limit 60 --json databaseId,event \
            --jq '.[] | select(.event == "schedule" or .event == "push") | .databaseId') \
            || { echo "::warning::Could not look up earlier refreshes; continuing without a saved feed"; run_ids=""; }
          tried=0
          for run_id in ${run_ids}; do
            [ "${tried}" -ge 15 ] && break
            tried=$((tried + 1))
            if gh run download "${run_id}" --repo "$GITHUB_REPOSITORY" --name feed-state --dir .state 2>/dev/null; then
              echo "Saved feed restored from run ${run_id}"
              break
            fi
            rm -rf .state  # never use a partial download
          done
          [ -f .state/feed.json ] || echo "No saved feed found; continuing without one"
      - name: Fetch feeds
        # The live feed.json is this run's memory of earlier items. If it cannot be read
        # (anything other than "not found"), the build stops and the current dashboard stays
        # up rather than being replaced by a partial one.
        env:
          PREVIOUS_FEED: ${{ steps.pages.outputs.base_url }}/data/feed.json
        run: >-
          python -m owlfeed build --out site/data/feed.json
          --previous-url "${PREVIOUS_FEED}?run=${GITHUB_RUN_ID}"
          --fallback-file .state/feed.json
      - name: Keep a copy for the next run
        run: mkdir -p .state && cp site/data/feed.json .state/feed.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feed-state
          path: .state/feed.json
          retention-days: 3
          if-no-files-found: error
      - name: Version CSS and JavaScript URLs
        # Adds ?v=<content hash> to every stylesheet, script and module import in this
        # checkout's site/, so a reader arriving mid-deploy never pairs cached old files with
        # new ones (Pages lets browsers cache for ~10 minutes). The checkout is thrown away
        # after the run, so the repository itself is never stamped.
        run: python -m owlfeed stamp site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    # Only this job can publish; it runs no repository code.
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
