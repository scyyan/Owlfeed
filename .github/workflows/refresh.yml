name: Refresh feed

# Fetches every source in sources.yml, merges the results with the feed that is
# currently live, and publishes the dashboard to GitHub Pages.
on:
  schedule:
    - cron: "4,19,34,49 * * * *" # every 15 minutes; GitHub may start scheduled runs a few minutes late
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One refresh at a time, so two runs never race to publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Fetch feeds
        # The live feed.json is this run's memory of earlier items. If it cannot be read
        # (anything other than "not found" on the very first run), the build stops and the
        # current dashboard stays up rather than being replaced by a partial one.
        env:
          PREVIOUS_FEED: ${{ steps.pages.outputs.base_url }}/data/feed.json
        run: python -m owlfeed build --out site/data/feed.json --previous-url "${PREVIOUS_FEED}?run=${GITHUB_RUN_ID}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
