name: Refresh feed

# Fetches every source in sources.yml, merges the results with the feed that is
# currently live, and publishes the dashboard to GitHub Pages.
on:
  schedule:
    - cron: "4,19,34,49 * * * *" # every 15 minutes; GitHub may start scheduled runs a few minutes late
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One refresh at a time, so two runs never race to publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Runs the fetcher (third-party feeds and packages) with read-only permissions.
    name: Fetch feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages looks up the site's URL
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (hash-pinned)
        run: pip install --require-hashes -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore the saved copy of the feed
        # Only used if the live feed.json answers 404 (e.g. a Pages hiccup), so history survives.
        uses: actions/cache/restore@v4
        with:
          path: .state/feed.json
          key: owlfeed-feed-${{ github.run_id }}
          restore-keys: owlfeed-feed-
      - name: Fetch feeds
        # The live feed.json is this run's memory of earlier items. If it cannot be read
        # (anything other than "not found"), the build stops and the current dashboard stays
        # up rather than being replaced by a partial one.
        env:
          PREVIOUS_FEED: ${{ steps.pages.outputs.base_url }}/data/feed.json
        run: >-
          python -m owlfeed build --out site/data/feed.json
          --previous-url "${PREVIOUS_FEED}?run=${GITHUB_RUN_ID}"
          --fallback-file .state/feed.json
      - name: Keep a copy for the next run
        run: mkdir -p .state && cp site/data/feed.json .state/feed.json
      - uses: actions/cache/save@v4
        with:
          path: .state/feed.json
          key: owlfeed-feed-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # Only this job can publish; it runs no repository code.
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
