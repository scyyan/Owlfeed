name: Keepalive

# GitHub turns off scheduled workflows in public repositories after 60 days without
# repository activity. Re-enabling them through the API each week resets that timer,
# so the 15-minute refresh keeps running even when nobody commits. A workflow you
# switched off yourself (Actions → workflow → Disable workflow) is left off.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    name: Re-enable scheduled workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable refresh and keepalive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for workflow in refresh.yml keepalive.yml; do
            state=$(gh api "repos/${REPO}/actions/workflows/${workflow}" --jq .state)
            if [ "${state}" = "disabled_manually" ]; then
              echo "${workflow} was disabled by hand; leaving it off"
              continue
            fi
            gh api --method PUT "repos/${REPO}/actions/workflows/${workflow}/enable"
            echo "Re-enabled ${workflow} (state was ${state})"
          done
