name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    # A pull request from this repository is already tested by its push run; forks are tested here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false  # nothing here pushes; keep the token off disk
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: pip install --only-binary ':all:' --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Python unit tests
        run: python -m pytest -q --ignore=tests/e2e
      - name: JavaScript unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m pytest -q tests/e2e

  feed-check:
    # Fetches every feed in sources.yml from GitHub's network and reports problems
    # in the run summary. Informational only: a broken feed never fails CI.
    name: Feed check
    # A pull request from this repository already ran the check on push; forks still get one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false  # nothing here pushes; keep the token off disk
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install --only-binary ':all:' --require-hashes -r requirements.txt
      - name: Check feeds
        run: python -m owlfeed check --include-disabled --samples 3 --summary-file "$GITHUB_STEP_SUMMARY"
