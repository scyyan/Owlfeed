name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Python unit tests
        run: python -m pytest -q --ignore=tests/e2e

  feed-check:
    # Fetches every feed in sources.yml from GitHub's network and reports problems
    # in the run summary. Informational only: a broken feed never fails CI.
    name: Feed check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check feeds
        run: python -m owlfeed check --include-disabled --samples 3 --summary-file "$GITHUB_STEP_SUMMARY" --inspect crisis-group
