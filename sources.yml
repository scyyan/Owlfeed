# Owlfeed sources
#
# Every source needs:
#   id        unique, lowercase letters/digits/dashes (used in URLs and saved state; don't rename casually)
#   name      shown on each item and in the sidebar
#   feed      the RSS or Atom feed URL
#   site      the publication's homepage (used for links and relative URLs)
#   category  sidebar category: Cyber or Geopolitics
#   group     sidebar group inside the category
# Optional:
#   enabled        false to keep a source listed but not fetched (default true)
#   summary_from   auto (default), description, or content: which feed field to summarize
#   exclude_title  list of regular expressions; matching headlines are skipped
#
# After editing, the CI "Feed check" job tests every feed and reports problems in its summary.

settings:
  retention_days: 7          # how long items stay on the dashboard
  max_items_per_source: 50   # newest entries taken from each feed per refresh
  summary_max_chars: 320     # summaries are trimmed to about this many characters

sources:
  # ── Cyber · Government & CERT ────────────────────────────────────────────
